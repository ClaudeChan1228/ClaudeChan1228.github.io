    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  var heatmapGrid = document.getElementById("heatmap-grid");
  var tooltip = document.getElementById("heatmap-tooltip");
  var WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];
  var MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  function getColorLevel(minutes) {
    if (minutes < 0) return "empty";
    if (minutes === 0) return "l0";
    if (minutes <= 15) return "l1";
    if (minutes <= 30) return "l2";
    if (minutes <= 60) return "l3";
    return "l4";
  }

  function renderHeatmap() {
    var data = window.__READING_HEATMAP__ || [];
    if (data.length === 0) {
      heatmapGrid.innerHTML = '<div class="heatmap-empty">暂无阅读数据</div>';
      return;
    }

    var year = new Date().getFullYear();
    var today = new Date();
    today.setHours(23, 59, 59, 999);

    var dataMap = new Map(data.map(function(d) { return [d.date, d.minutes]; }));

    // Build per-month data: each month has N "week columns" (Mon-Sun grid)
    var monthsData = [];
    for (var m = 0; m < 12; m++) {
      var firstDay = new Date(year, m, 1);
      var firstDow = firstDay.getDay();
      var firstDowMon = firstDow === 0 ? 6 : firstDow - 1; // 0=Mon … 6=Sun
      var daysInMonth = new Date(year, m + 1, 0).getDate();
      var numCols = Math.ceil((firstDowMon + daysInMonth) / 7);

      var cols = [];
      var dayNum = 1;
      for (var c = 0; c < numCols; c++) {
        var col = [];
        for (var r = 0; r < 7; r++) {
          if ((c === 0 && r < firstDowMon) || dayNum > daysInMonth) {
            col.push(null);
          } else {
            var dateStr = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(dayNum).padStart(2, "0");
            var dCheck = new Date(year, m, dayNum);
            if (dCheck > today) {
              col.push({ date: dateStr, minutes: -1 });
            } else {
              var minutes = dataMap.get(dateStr) || 0;
              col.push({ date: dateStr, minutes: minutes });
            }
            dayNum++;
          }
        }
        cols.push(col);
      }
      monthsData.push({ month: m, cols: cols, numCols: numCols });
    }

    // Build grid-template-columns: 28px label + 1fr per data col + 8px month-separators
    var colSizes = "28px";
    for (var i = 0; i < monthsData.length; i++) {
      var md = monthsData[i];
      for (var c = 0; c < md.numCols; c++) {
        colSizes += " 1fr";
      }
      if (i < monthsData.length - 1) {
        colSizes += " 4px";
      }
    }
    heatmapGrid.style.gridTemplateColumns = colSizes;

    // Build HTML — single grid: row 1 = month labels, rows 2-8 = weekday cells
    var html = "";

    // Row 1: Month labels
    html += '<div class="hm-month-placeholder"></div>';
    for (var i = 0; i < monthsData.length; i++) {
      var md2 = monthsData[i];
      html += '<div class="hm-month-label" style="grid-column:span ' + md2.numCols + '">' + MONTHS[md2.month] + '</div>';
      if (i < monthsData.length - 1) {
        html += '<div class="hm-month-sep-gap"></div>';
      }
    }

    // Rows 2-8: One row per weekday
    for (var dow = 0; dow < 7; dow++) {
      html += '<div class="hm-day-label">' + WEEKDAYS[dow] + '</div>';
      for (var i = 0; i < monthsData.length; i++) {
        var md3 = monthsData[i];
        for (var c = 0; c < md3.cols.length; c++) {
          var cell = md3.cols[c][dow];
          if (cell === null) {
            html += '<div class="hm-cell hm-placeholder"></div>';
          } else {
            var level = getColorLevel(cell.minutes);
            var titleAttr = cell.minutes >= 0 ? fmtDate(cell.date) + " \u00B7 \u9605\u8BFB " + cell.minutes + " \u5206\u949F" : "\u5C1A\u672A\u5230\u6765";
            html += '<div class="hm-cell hm-' + level + '" data-date="' + cell.date + '" data-minutes="' + cell.minutes + '" title="' + titleAttr + '"></div>';
          }
        }
        if (i < monthsData.length - 1) {
          html += '<div class="hm-cell hm-sep-gap"></div>';
        }
      }
    }

    heatmapGrid.innerHTML = html;

    // Tooltip events
    heatmapGrid.querySelectorAll('.hm-cell[data-minutes]').forEach(function(cell) {
      cell.addEventListener("mouseenter", function(e) {
        var mins = parseInt(this.dataset.minutes);
        if (mins < 0) return;
        tooltip.textContent = fmtDate(this.dataset.date) + " \u00B7 \u9605\u8BFB " + mins + " \u5206\u949F";
        tooltip.style.display = "block";
      });
      cell.addEventListener("mousemove", function(e) {
        tooltip.style.left = (e.pageX + 10) + "px";
        tooltip.style.top = (e.pageY - 30) + "px";
      });
      cell.addEventListener("mouseleave", function() {
        tooltip.style.display = "none";
      });
    });
  }

  var currentWeekIndex = 0;
  var weekRange = document.getElementById("week-range");
  var weekSelect = document.getElementById("week-select");
  var weeklyStats = document.getElementById("weekly-stats");
  var weeklyBooksList = document.getElementById("weekly-books-list");
  var wordCloud = document.getElementById("word-cloud");
  var weeklyCloudSection = document.getElementById("weekly-cloud-section");

  var CLOUD_COLORS = ["#3498db","#e74c3c","#2ecc71","#9b59b6","#f39c12","#1abc9c","#e67e22","#2980b9"];

  function renderWeek(index) {
    var weeks = window.__READING_WEEKLY__ || [];
    if (weeks.length === 0) {
      weeklyStats.innerHTML = '<div class="weekly-empty">暂无周阅读数据</div>';
      weeklyBooksList.innerHTML = "";
      wordCloud.innerHTML = "";
      weeklyCloudSection.style.display = "none";
      return;
    }

    if (index < 0) index = 0;
    if (index >= weeks.length) index = weeks.length - 1;
    currentWeekIndex = index;

    var week = weeks[index];
    var isCurrentWeek = (index === 0);

    document.getElementById("week-prev").disabled = (index >= weeks.length - 1);
    document.getElementById("week-next").disabled = (index <= 0);
    document.getElementById("week-today").style.display = isCurrentWeek ? "none" : "inline-block";

    var startParts = week.weekStart.split("-");
    var endParts = week.weekEnd.split("-");
    weekRange.textContent = startParts[1] + "/" + startParts[2] + " - " + endParts[1] + "/" + endParts[2];

    weekSelect.value = index;

    var hours = Math.floor((week.totalReadingTime || 0) / 60);
    var mins = (week.totalReadingTime || 0) % 60;
    var timeStr = hours > 0 ? hours + "h " + mins + "min" : mins + "min";
    weeklyStats.innerHTML =
      '<div class="weekly-stat-item"><span class="weekly-stat-val">\u23F1\uFE0F ' + timeStr + '</span><span class="weekly-stat-lbl">累计阅读</span></div>' +
      '<div class="weekly-stat-item"><span class="weekly-stat-val">\u{1F4C5} ' + (week.daysActive || 0) + '</span><span class="weekly-stat-lbl">活跃天数</span></div>' +
      '<div class="weekly-stat-item"><span class="weekly-stat-val">\u2710\uFE0F ' + (week.totalHighlights || 0) + '</span><span class="weekly-stat-lbl">累计划线</span></div>' +
      '<div class="weekly-stat-item"><span class="weekly-stat-val">\u{1F4AC} ' + (week.totalNotes || 0) + '</span><span class="weekly-stat-lbl">累计笔记</span></div>';

    var books = week.books || [];
    if (books.length === 0) {
      weeklyBooksList.innerHTML = '<div class="weekly-empty">本周暂无在读书籍（单书阅读 &lt; 15 分钟不展示）</div>';
    } else {
      weeklyBooksList.innerHTML = books.map(function(b) {
        var pct = b.progress || 0;
        var coverHTML = b.cover ? '<img class="weekly-book-cover" src="' + b.cover + '" srcset="/img/loading.gif" lazyload alt="">' : "";
        return '<div class="weekly-book-card">' +
          coverHTML +
          '<div class="weekly-book-info">' +
            '<span class="weekly-book-title">' + escHtml(b.title) + '</span>' +
            '<span class="weekly-book-author">' + escHtml(b.author || "") + '</span>' +
            '<div class="weekly-book-progress">' +
              '<div class="weekly-book-progress-bar"><div class="weekly-book-progress-fill" style="width:' + pct + '%"></div></div>' +
              '<span class="weekly-book-progress-pct">' + pct + '%</span>' +
            '</div>' +
            '<span class="weekly-book-time">本周 ' + b.readingTime + ' 分钟</span>' +
          '</div>' +
        '</div>';
      }).join("");
      // Strip lazyload/srcset injected by hexo post-processor (fixes broken images on week switch)
      weeklyBooksList.querySelectorAll(".weekly-book-cover").forEach(function(img) {
        img.removeAttribute("lazyload");
        img.removeAttribute("srcset");
        img.addEventListener("error", function() { this.style.display = "none"; });
      });
    }

    var keywords = week.keywords || [];
    if (keywords.length === 0) {
      weeklyCloudSection.style.display = "none";
    } else {
      weeklyCloudSection.style.display = "";
      var maxWeight = Math.max.apply(null, keywords.map(function(k) { return k.weight; }));
      var shuffled = keywords.slice().sort(function() { return Math.random() - 0.5; });
      wordCloud.innerHTML = shuffled.map(function(k) {
        var fontSize = 12 + (k.weight / maxWeight) * 24;
        var opacity = 0.4 + (k.weight / maxWeight) * 0.6;
        var color = CLOUD_COLORS[Math.floor(Math.random() * CLOUD_COLORS.length)];
        return '<span class="cloud-word" style="font-size:' + fontSize + 'px; opacity:' + opacity + '; color:' + color + '">' + escHtml(k.word) + '</span>';
      }).join("");
    }
  }

  function initWeekSelector() {
    var weeks = window.__READING_WEEKLY__ || [];
    weekSelect.innerHTML = weeks.map(function(w, i) {
      var sp = w.weekStart.split("-");
      var ep = w.weekEnd.split("-");
      var label = sp[1] + "/" + sp[2] + " - " + ep[1] + "/" + ep[2];
      var isCurrent = i === 0;
      return '<option value="' + i + '"' + (isCurrent ? ' selected' : "") + '>' + (isCurrent ? '本周 ' : "") + label + '</option>';
    }).join("");

    document.getElementById("week-prev").addEventListener("click", function() {
      var weeksL = window.__READING_WEEKLY__ || [];
      if (currentWeekIndex < weeksL.length - 1) renderWeek(currentWeekIndex + 1);
    });
    document.getElementById("week-next").addEventListener("click", function() {
      if (currentWeekIndex > 0) renderWeek(currentWeekIndex - 1);
    });
    weekSelect.addEventListener("change", function() {
      renderWeek(parseInt(this.value));
    });
    document.getElementById("week-today").addEventListener("click", function() {
      renderWeek(0);
    });

    renderWeek(0);
  }

  function renderActivityFeed() {
    var entries = window.__READING_DAILY__ || [];
    var feed = document.getElementById("activity-feed");

    if (entries.length === 0) {
      feed.innerHTML = '<div class="activity-empty">暂无阅读记录</div>';
      return;
    }

    feed.innerHTML = entries.map(function(entry, i) {
      var stats = entry.stats || {};
      var books = entry.books || [];
      var bookNames = books.slice(0, 3).map(function(b) { return '《' + escHtml(b.title) + '》'; }).join("、");
      var moreCount = books.length > 3 ? " 等 " + books.length + " 本书" : (books.length > 0 ? " 等 " + books.length + " 本书" : "");
      var bookDisplay = books.length > 0 ? (books.length <= 3 ? "📚 " + bookNames : "📚 " + bookNames + moreCount) : "";
      var isLast = i === entries.length - 1;
      var hasDetail = (entry.highlights && entry.highlights.length > 0) || (entry.thoughts && entry.thoughts.length > 0);

      var detailHTML = "";
      if (hasDetail) {
        detailHTML = '<div class="activity-detail" id="activity-detail-' + i + '" style="display:none">';
        if (entry.highlights && entry.highlights.length > 0) {
          detailHTML += '<div class="activity-detail-section"><span class="activity-detail-label">\u270D\uFE0F 划线</span>' +
            entry.highlights.map(function(h) { return '<div class="activity-detail-item highlight-item">"' + escHtml(h.text) + '"<span class="activity-detail-book"> — ' + escHtml(h.book || "") + '</span></div>'; }).join("") +
            '</div>';
        }
        if (entry.thoughts && entry.thoughts.length > 0) {
          detailHTML += '<div class="activity-detail-section"><span class="activity-detail-label">\u{1F4AC} 想法</span>' +
            entry.thoughts.map(function(t) { return '<div class="activity-detail-item thought-item">' + escHtml(t.content) + '<span class="activity-detail-book"> — ' + escHtml(t.book || "") + '</span></div>'; }).join("") +
            '</div>';
        }
        detailHTML += '</div>';
      }

      var expandBtn = hasDetail ? '<button class="activity-expand-btn" data-idx="' + i + '">展开 ▾</button>' : "";
      var readingMins = stats.readingTime || 0;
      var dotClass = readingMins > 0 ? "activity-dot-active" : "activity-dot-idle";
      var itemClass = isLast ? "activity-item activity-item-last" : "activity-item";

      return '<div class="' + itemClass + '">' +
        '<div class="activity-dot ' + dotClass + '"></div>' +
        '<div class="activity-content">' +
          '<div class="activity-header">' +
            '<span class="activity-date">' + fmtDate(entry.date) + '</span>' +
            '<span class="activity-time">📖 ' + readingMins + ' 分钟</span>' +
            expandBtn +
          '</div>' +
          (bookDisplay ? '<div class="activity-books">' + bookDisplay + '</div>' : "") +
          '<div class="activity-meta">' +
            '<span>\u2710\uFE0F ' + (stats.highlightsCount != null ? stats.highlightsCount : 0) + ' 条划线</span>' +
            '<span>\u{1F4AC} ' + (stats.notesCount != null ? stats.notesCount : 0) + ' 条想法</span>' +
          '</div>' +
          detailHTML +
        '</div>' +
      '</div>';
    }).join("");

    feed.querySelectorAll(".activity-expand-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var idx = this.dataset.idx;
        var detail = document.getElementById("activity-detail-" + idx);
        if (detail.style.display === "none") {
          detail.style.display = "block";
          this.textContent = "收起 \u25B4";
        } else {
          detail.style.display = "none";
          this.textContent = "展开 \u25BE";
        }
      });
    });
  }

  renderHeatmap();
  initWeekSelector();
  renderActivityFeed();
})();
</script>

<style>

}

.reading-section {

.section-title {

  color: #767676;

.hm-month-sep-gap {

}

.hm-day-label {

  height: 13px;

  color: #767676;

}

.hm-cell {

  border-radius: 3px;

.hm-cell.hm-l1          { background: #c6e48b; }
.hm-cell.hm-l2          { background: #7bc96f; }
.hm-cell.hm-l3          { background: #239a3b; }
.hm-cell.hm-l4          { background: #196127; }
.hm-cell.hm-sep-gap     { background: transparent; cursor: default; pointer-events: none; border-radius: 0; }

.hm-cell.hm-l0:hover,
.hm-cell.hm-l1:hover,
.hm-cell.hm-l2:hover,
.hm-cell.hm-l3:hover,
.hm-cell.hm-l4:hover {
  outline: 2px solid rgba(0,0,0,0.3);

}

.heatmap-legend {

  justify-content: flex-end;

}

.legend-label {
  font-size: 11px;
  color: #767676;
}

.legend-cell {
  width: 13px;
  height: 13px;
  border-radius: 3px;
  display: inline-block;
}

.legend-empty { background: #ebedf0; }
.legend-l1    { background: #c6e48b; }
.legend-l2    { background: #7bc96f; }
.legend-l3    { background: #239a3b; }
.legend-l4    { background: #196127; }

.heatmap-tooltip {
  position: fixed;
  background: #24292e;
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  pointer-events: none;
  z-index: 1000;
  white-space: nowrap;
}

.heatmap-empty {
  text-align: center;
  color: #bbb;
  padding: 30px 0;
  font-size: 14px;
}

/* ── Weekly card wall ────────────────────────────────────── */
.weekly-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.weekly-header-row .section-title {
  margin: 0;
}

.week-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.week-arrow {

  opacity: 0.4;

}

.week-range {
  font-weight: 500;
  color: #2c3e50;
  min-width: 100px;
  text-align: center;
}

.week-select {
  padding: 4px 6px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 12px;
  color: #555;
  background: #fff;
  max-width: 160px;
}

.week-today-btn {
  background: #3498db;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 12px;

}

.week-today-btn:hover {
  background: #2980b9;
}

.weekly-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.weekly-stat-item {
  text-align: center;
  color: #fff;
}

.weekly-stat-val {
  display: block;
  font-size: 16px;
  font-weight: 700;
}

.weekly-stat-lbl {
  display: block;
  font-size: 11px;
  opacity: 0.85;
  margin-top: 2px;
}

.subsection-title {
  font-size: 15px;

  font-weight: 600;
}

.weekly-books-section {
  margin-bottom: 20px;
}

.weekly-books-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.weekly-book-card {
  display: flex;
  gap: 12px;
  padding: 12px;
  background: #fafafa;

  width: 48px;

.weekly-book-info {
  flex: 1;
  display: flex;
  flex-direction: column;

.weekly-book-title {
  font-size: 14px;
  font-weight: 500;
  color: #2c3e50;
}

.weekly-book-author {
  font-size: 12px;
  color: #999;
}

.weekly-book-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.weekly-book-progress-bar {
  flex: 1;
  height: 6px;
  background: #e0e0e0;
  border-radius: 3px;
  overflow: hidden;

  height: 100%;
  background: #27ae60;

  font-size: 12px;
  color: #888;
  min-width: 36px;
  text-align: right;
}

.weekly-book-time {
  font-size: 11px;
  color: #aaa;
}

.weekly-empty {
  text-align: center;
  color: #bbb;
  padding: 24px 0;
  font-size: 13px;
}

/* Word cloud */
.weekly-cloud-section {
  padding-top: 16px;
  border-top: 1px solid #f0f0f0;
}

.word-cloud {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px 14px;
  padding: 16px 0;
  min-height: 60px;
}

.cloud-word {
  display: inline-block;
  transition: transform 0.2s;
  cursor: default;
  line-height: 1.4;
  font-weight: 500;
}

.cloud-word:hover {
  transform: scale(1.2);
}

/* ── Activity feed ───────────────────────────────────────── */
.activity-feed {
  position: relative;
}

.activity-item {
  display: flex;
  gap: 14px;
  padding: 8px 0 16px 0;
  position: relative;
}

.activity-item::before {
  content: '';
  position: absolute;
